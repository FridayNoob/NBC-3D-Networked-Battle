// ============================================================================
//  nbc_m3.proto —— M3 正式协议（房间 / 状态同步 / 副本 / 掉落）
//  项目：3D联网战斗Demo（NBC）
//
//  CONTRACT_VERSION: 1
//  ⚠️ **改这个文件时，若改的是"不兼容"的改动（删字段、改类型、改语义），
//     必须把上面这行的版本号 +1**，并同步 `Shared/Net/NetContract.cs` 里的常量。
//     —— 有一条机械检查盯着这两处是否一致
//     （`Tests\EditMode\Net\ProtocolTests.cs`：直接读本文件比对）。
//
//  ---------------------------------------------------------------------------
//  一、为什么协议是"唯一来源 + 生成物入库"
//  ---------------------------------------------------------------------------
//  需求文档 §4.2 定的：**协议的唯一来源是 `Protocol/*.proto`**，
//  两端都用 `protoc` 从**同一份** `.proto` 生成 C#，**生成产物提交进仓库**。
//  手写协议类不再存在 —— 那样两端一定会漂移，而漂移不报错（和 D1 那条同一个道理）。
//
//  ---------------------------------------------------------------------------
//  二、生成命令（⚠️ protoc 与运行时**必须配对**）
//  ---------------------------------------------------------------------------
//      cd /d <仓库根>                       ← 工作目录走 Unicode API，中文路径没问题
//      "E:\U3D Projects\TeachNet\Protobuf\protoc.exe" ^
//          --proto_path=Protocol ^
//          --csharp_out=Client/Assets/_Project/Protocol ^
//          Protocol/nbc_m3.proto
//
//  ⚠️ 三条硬约束（`Docs\11` §5.2 有完整说明）：
//    ① protoc **3.21.1** ←→ Google.Protobuf **3.21.1**（混版本会得到"编译不过/运行期报错"，
//       而且报错**不会**提示是版本问题）
//    ② **绝不要给 protoc 传含中文的路径**（argv 走 ANSI 代码页，中文路径会被破坏）
//    ③ 参数只给相对路径、工作目录设成仓库根
//
//  ---------------------------------------------------------------------------
//  三、这一版协议覆盖什么（对应 Docs\25 的切片）
//  ---------------------------------------------------------------------------
//      S3 握手 + 心跳         Handshake / HandshakeAck / Ping / Pong
//      S4 房间与席位          JoinRoomRequest / RoomState / RoomMember
//      S5 状态同步            PlayerInput（客户端只发**意图**）/ WorldSnapshot / EntitySnapshot
//      S6/S7 事件与掉落       ServerEvent（伤害/死亡/掉落）
//
//  ⚠️ 客户端**只发意图**（`PlayerInput`），位置、伤害、掉落**全部由服务端算**（服务器权威）。
//     M3 **不做客户端预测**（`Docs\25` D4）—— 所以操作会有延迟，这是**有意**的取舍。
// ============================================================================

syntax = "proto3";

package nbc.m3;

// 生成的 C# 命名空间（不写会按 package 推导成 Nbc.M3）
option csharp_namespace = "NBC.Protocol";

// ============================================================================
//  握手与心跳（S3）
// ============================================================================

/// 客户端连上之后发的第一条消息。
///
/// ⚠️ M4-S3（SRV-06 真正的登录）**新增 4、5 两个字段**，是**兼容改动**（只加字段）：
///    · 老客户端不填 ⇒ `account` 为空 ⇒ 服务端按**游客**处理（老行为一字不变）
///    · 老服务端收到新客户端 ⇒ 未识别字段被 proto3 忽略 ⇒ 退回游客
///    ⇒ 所以 `CONTRACT_VERSION` **保持不变**（判据见本文件顶部）。
message Handshake
{
    int32  protocol_version = 1;   // = .proto 顶部的 CONTRACT_VERSION（不一致服务端直接拒绝）
    string client_version   = 2;   // 客户端构建标识，只用于日志排查
    string player_name      = 3;   // 玩家名（**游客**用；登录成功时服务端改用档案昵称）
    string account          = 4;   // 登录名；**留空 = 游客**（M4-S3 追加）
    string password_digest  = 5;   // = SHA256(明文密码) 的小写十六进制（M4-S3 追加）
                                   // ⚠️ 线上**不放明文密码**，但**也不等于安全**：
                                   //    没有 TLS ⇒ 这个摘要被抓到就能重放。取舍写在 `Docs\27` §十九。
                                   //    配方实现在**双端共享层** `NBC.Shared.Auth.PasswordDigest`（一份代码）。
}

/// 握手结果。
message HandshakeAck
{
    bool   accepted         = 1;
    int32  protocol_version = 2;   // 服务端的版本（accepted=false 时用来对比）
    string server_version   = 3;
    int64  player_id        = 4;   // 服务端分配的玩家 id（> 0）
    string reason           = 5;   // accepted=false 时说清为什么（人话）
    int32  tick_hz          = 6;   // 服务端 tick 频率（M3 = 30）
    string nickname         = 7;   // 服务端认定的显示名（登录 = 档案昵称；游客 = 发来的 player_name）
                                   // （M4-S3 追加：客户端不用猜"我叫什么"）
}

/// 心跳（客户端主动发；服务端回 Pong 时不带内容）。
message Ping { int64 client_time_ms = 1; }
message Pong { int64 client_time_ms = 1; int64 server_time_ms = 2; }

// ============================================================================
//  房间与席位（S4）
// ============================================================================

/// 房间阶段。
enum RoomPhase
{
    ROOM_PHASE_WAITING  = 0;   // 等人（还没开打）
    ROOM_PHASE_RUNNING  = 1;   // 副本进行中
    ROOM_PHASE_FINISHED = 2;   // 已结束（BOSS 死了 / 全灭）
}

/// 请求进房。M3 的模型是 **一个房间 = 一个副本实例**（`Docs\25` D6）。
message JoinRoomRequest
{
    string room_id    = 1;   // 留空 = 让服务端分配一个（进大厅的简化版）
    int32  dungeon_id = 2;   // 想打哪个副本（`Dungeon` 表主键）
}

/// 请求离开当前房间（**M3-S4 追加**）。
///
/// ⚠️ 本消息与下面的 `ErrorResponse` 都是**兼容改动**（只加消息 / 加 oneof 字段）：
///    proto3 里未知字段会被忽略，所以旧的一端不会因此出错 ——
///    **`CONTRACT_VERSION` 保持 1**（判据见本文件顶部：只有删字段 / 改类型 / 改语义才要 +1）。
message LeaveRoomRequest
{
}

/// 一句"你的请求被拒了，因为……"（**M3-S4 追加**）。
///
/// 为什么必须有它：M3 到处的判据都是"**失败要 fail loud，还要说人话**"——
/// 进房失败（房间满 / 重复进房 / 房间不存在）如果只是"什么都不回"，
/// 客户端就只能显示"点了没反应"，那是最难查的一类问题。
///
/// ⚠️ 与 `RoomState` 的分工（**别混**）：
///    · `RoomState`  = 你现在的房间**长什么样**（空房间状态 = 你不在任何房间）
///    · `ErrorResponse` = 你刚发的那个请求**被拒了**，原因是……
message ErrorResponse
{
    int32  code    = 1;   // 机器可判的编号（常量在 `Shared\Net\NetErrors.cs`）
    string message = 2;   // 人话（可以直接显示给玩家 / 写日志）
}

/// 房间里的一个席位。
message RoomMember
{
    int64  player_id   = 1;
    string player_name = 2;
    bool   is_host     = 3;   // 房主（M3 里房主只是标记，暂时没有特权）
    bool   ready       = 4;
}

/// 房间状态（**每次有变化就整份下发**，2~4 人量级不值得做差分）。
message RoomState
{
    string             room_id    = 1;
    int32              dungeon_id = 2;
    repeated RoomMember members   = 3;
    int32              capacity   = 4;
    RoomPhase          phase      = 5;
}

// ============================================================================
//  输入：客户端**只发意图**（S5）
// ============================================================================

/// 一帧的输入命令。
/// ⚠️ 沿用 A7 的量化约定（`InputCommand`）：移动轴 -1000..1000、动作是**位掩码**。
///    这样"客户端采集 → 过网线 → 服务端重建"是**同一个值**，不需要浮点。
message PlayerInput
{
    int64  player_id           = 1;
    int32  client_tick         = 2;   // 客户端自己的帧号（日志/对账用，不是权威）
    int32  move_x              = 3;   // -1000..1000（= -1..+1）
    int32  move_y              = 4;
    uint32 action_bits         = 5;   // 本帧**新按下**的动作（第 0 位 = 技能1/普攻，见上面的说明）
    uint32 action_release_bits = 6;   // 本帧**新松开**的动作
    int32  target_entity_id    = 7;   // 当前目标（服务端会校验它是否合法）
}

// ============================================================================
//  世界快照：服务端 → 客户端（S5）
// ============================================================================

/// 一个战斗单位的快照。
///
/// ⚠️ 这里同时有 `entity_id` 与 `config_id`，**不是冗余**（M2 的教训）：
///     · `config_id` = 配置表编号（6001 = 野狼）→ 表现层用它找模型、UI 用它显示名字
///     · `entity_id` = 运行时实例编号 → 定位"这一个具体的怪"
///     合并两者的话，"同一个 6001 刷两只"就会撞号（M2-B 已记过原因）。
message EntitySnapshot
{
    int32 entity_id  = 1;
    int32 config_id  = 2;
    int32 kind       = 3;   // 0 = 英雄，1 = 怪物（对应 `EBattleAgentKind`）
    int32 hp         = 4;
    int32 max_hp     = 5;
    int32 pos_x_mm   = 6;   // 位置（**毫米**，整数）；M3 先在平面上跑，Y 轴留空
    int32 pos_z_mm   = 7;
    int32 facing_deg = 8;   // 朝向（度，0..359）
    bool  alive      = 9;

    // M4-S1b 追加（**兼容改动**：proto3 里加字段是兼容的，CONTRACT_VERSION 保持 1）。
    //
    // ⚠️ 为什么必须有它：客户端得知道**快照里哪个英雄是自己**。
    //    原来只有 `kind`（0 = 英雄），两个客户端时**分不出你我** ——
    //    于是"自动走向目标""把血条画在我头上"这类事**没法做**，只能靠"猜第一个活着的英雄"，
    //    而猜错的表现是"我的调试工具在操纵别人的角色"，**静默且看起来很正常**。
    //    `0` = 无主（怪物、或还没分配席位的英雄）。
    int64 owner_player_id = 10;
}

/// 一帧的世界快照。
message WorldSnapshot
{
    int32                   server_tick = 1;   // 服务端帧号（单调递增）
    repeated EntitySnapshot entities    = 2;
}

// ============================================================================
//  事件：快照之外"发生了一件事"（S5~S7）
// ============================================================================

/// 造成了伤害。
message DamageEvent
{
    int32 attacker_id  = 1;
    int32 target_id    = 2;
    int32 applied      = 3;   // **实际扣掉**的血（不是打出去的伤害值）
    int32 remaining_hp = 4;
}

/// 一个单位死了。
message DeathEvent
{
    int32 entity_id = 1;
    int32 config_id = 2;
    int32 kind      = 3;   // 0 = 英雄，1 = 怪物
    int32 killer_id = 4;   // 0 = 没有击杀者（环境）
}

/// 掉落了物品（**服务端掷的**，客户端只负责显示）。
message DropEvent
{
    int32 item_id          = 1;
    int32 count            = 2;
    int64 winner_player_id = 3;   // 归谁（M3 先做"击杀者获得"）
}

/// 服务端事件（用 oneof：一条消息只承载一件事）。
message ServerEvent
{
    oneof event
    {
        DamageEvent damage = 1;
        DeathEvent  death  = 2;
        DropEvent   drop   = 3;
    }
}

// ============================================================================
//  信封：一条消息 = 一个 payload（**帧格式另行加长度前缀**，见 Docs\25 D1）
// ============================================================================

/// 一条条件的**权威进度**。
message ConditionProgressEntry
{
    int32 condition_key = 1;   // `QuestCondition` 表主键
    int32 current       = 2;   // 已累计（**服务端权威**；已钳位在 required 以内）
    int32 required      = 3;   // 需求值
    bool  met           = 4;   // 达成了没有
}

/// 服务端 → 客户端的**权威进度同步**（M4-S3 收口：§21.4 未做#2）。
///
/// ⚠️ 为什么必须有这一条：在此之前客户端**自己也算一份**进度（= 预测）。
///    两边数值一致，但**仍是两个账房** —— 只要配置、时序、或"哪个事件喂了几次"
///    有半点不同，就会出现"客户端显示已完成、服务端说没达成"（而且**不报错**）。
///    这一条消息把"谁是权威"钉死在服务端：客户端**只显示**收到的东西。
///
/// ⚠️ 兼容性：**只加消息 + 只加 oneof 分支** ⇒ 老客户端忽略未知字段（proto3）、
///    老服务端不发这条 ⇒ 客户端退回"自己算"的旧行为。**不需要升 `CONTRACT_VERSION`。**
message ProgressSync
{
    repeated ConditionProgressEntry entries = 1;
    int64 server_tick = 2;   // 服务端逻辑帧号（排查"这条是什么时候的"）
}

/// 客户端 → 服务端：**任务动作请求**（M4-S3 §二十六：接取 / 交付）。
///
/// ⚠️ **为什么合成一条消息 + 一个 `action` 整数**，而不是 `AcceptQuestRequest` /
///    `SubmitQuestRequest` 两条：
///      · 两条消息 ⇒ **两条处理器**，而"身份校验（游客拒绝）→ 状态机 → 回状态同步 → 推送"
///        这套流程两边**一字不差**；写两遍就是两处会不一致的地方（本项目最忌讳的形状）。
///      · 合成一条之后，**校验与推送只有一份**，加动作（放弃/追踪）也只是多一个数字。
///    ⚠️ 代价（如实记）：动作是**数字**，映射关系靠注释和代码约定 ——
///    与 `owner_kind`（台账）/ `state`（`quest_state` 表）**同一个套路**，
///    所以它必须在**两端**都有一份说清数字的含义（见 `ClientMessage` 下面的取值表）。
message QuestActionRequest
{
    int32 quest_id = 1;   // `Quest` 表主键
    int32 action   = 2;   // **动作**（不是状态）：1 = 接取；2 = 交付
}

/// 一个任务的**当前状态**。
message QuestStateEntry
{
    int32 quest_id = 1;   // `Quest` 表主键
    int32 state    = 2;   // **状态数字**：1=Accepted 2=Completed 3=Submitted
                          // ⚠️ 必须与 `EQuestStage`（服务端）/ `EQuestState`（客户端）
                          //    **数字完全一致** —— 两端靠数字对齐、**不共享类型**，
                          //    所以动枚举时**两边都要重核**（已逐个核过一轮）。
                          // ⚠️ **没有 0**：0 = "表里没有这一行" = 未接取。
                          //    这条消息里**不会**出现 0（没接过的任务压根不发）。
}

/// 服务端 → 客户端：**任务状态同步**（M4-S3 §二十六）。
///
/// ⚠️ **全量**（这个玩家**全部**任务的状态），不是"只发变化的那一个"：
///    与 `ProgressSync` / 每 tick 全量快照同一个判据（D5）——
///    增量一旦漏一条就会**永久**少一个任务的状态，而且**不报错**。
///    全量的代价是重复传输，但任务数量是个位数，可以忽略。
///
/// ⚠️ 与 `ProgressSync` 的**分工**（两者都别省）：
///    · `ProgressSync`  = "**某个条件**累计了多少"（任务与成就**共用**那一套）
///    · `QuestStateSync` = "**某个任务**到哪一步了"（只有任务有状态机）
///    成就没有"接取/交付"，所以它只需要前者。
///
/// ⚠️ 兼容性：**只加消息 + 只加 oneof 分支** ⇒ `CONTRACT_VERSION` **保持 1**。
message QuestStateSync
{
    repeated QuestStateEntry entries = 1;
    int64 server_tick = 2;   // 服务端逻辑帧号（排查"这条是什么时候的"）
}

/// 客户端 → 服务端：**一条锁步输入**（M4-S4 S4-c）。
///
/// ⚠️ **定点一律传 `Fix64.RawValue`（int64）**，**不许** float/double ——
///    前两刀（S4-a 定点数学 / S4-b 确定性内核）的全部意义就是"两端逐位相同"，
///    在协议上放一个浮点就把那条保证废掉了。
message LockstepInput
{
    int32 frame = 1;   // 这条输入属于第几帧
    int32 seq   = 2;   // 同一玩家**单调递增**的序号：服务端用它**去重**（重复发只认第一条）
    int64 move_x_raw = 3;   // 移动方向 X（`Fix64.RawValue`，Q32.32）
    int64 move_y_raw = 4;   // 移动方向 Y
    int32 buttons = 5;      // 按键位掩码（各端同一份含义）
    int32 target_entity_id = 6;   // 要打的目标（0 = 不攻击）
}

/// 一帧里某个玩家的输入（服务端广播用）。
message LockstepFrameInput
{
    int64 player_id = 1;
    int64 move_x_raw = 2;
    int64 move_y_raw = 3;
    int32 buttons = 4;
    int32 target_entity_id = 5;

    /// ⚠️ **true = 这位玩家这一帧没发输入，填的是默认输入（不动不打）**。
    ///    这个字段是**刻意**留的：缺人必须**看得见**，否则客户端只会觉得"他怎么不动"。
    bool missing = 6;
}

/// 服务端 → 客户端：**第 frame 帧的全部输入** + **服务端算出的该帧状态哈希**。
///
/// ⚠️ `server_hash` 是客户端**对账**用的：自己 Step 出来的哈希与它不等 ⇒ 立刻知道自己跑偏了。
///    ⚠️ 用 `uint64`：FNV-1a 64 位会超出 `long` 的正区间（C# 侧映射成 `ulong`）。
message LockstepFrame
{
    int32 frame = 1;
    repeated LockstepFrameInput inputs = 2;
    uint64 server_hash = 3;
}

/// 开局时一个实体的**完整初始状态**（M4-S4 S4-c 第二半）。
///
/// ⚠️⚠️ **这个消息的全部意义：让客户端能逐位复现"第 0 帧哈希"。**
///     `WorldStateHash` 的字段清单是**契约**，它读 9 样东西：
///         实体个数 / Id / Position.X,Y,Z(RawValue) / Hp / **MaxHp** / **AttackReadyTick** / Tick
///     所以这里**全部都要发** —— 一个都不许靠"约定默认值"。
///
///     ⚠️ 为什么"不许靠默认"：现有 `WorldState.Add` 恰好把 `MaxHp = hp`、
///        `AttackReadyTick = 0`，所以此刻这两个值**推得出来**。但只要将来任何一处改一下
///        （某个实体**带伤出生**、或开局先给一段冷却），发的一方与收的一方就会
///        **各自按不同假设建世界** ⇒ 第 0 帧哈希就不同 ⇒ 表现是**满屏假分歧**，
///        而且排查方向全错（会去查"哪一帧算错了"，其实是"起点就不一样"）。
message LockstepStartEntity
{
    /// ⚠️ 与 `SimEntity.Id`（内存里是 **`int`**）说清并一致：
    ///    **wire 上取宽的一侧（`int64`）**，转换处必须**显式**并带一句注释 ——
    ///    否则将来 Id 真的超过 `int` 范围时会**静默窄化**（两边算出不同实体）。
    int64 entity_id = 1;

    /// 位置（`Fix64.RawValue`，Q32.32）。⚠️ 与 S4-c 其余部分同一套：**传 raw 整数、不传浮点**。
    int64 pos_x_raw = 2;
    int64 pos_y_raw = 3;
    int64 pos_z_raw = 4;

    /// ⚠️ 下面三个**就是 `SimEntity` 里那个 `int` 字段本身**，
    ///    **不是**"tick 编号的另一种解释"、也**不是**毫米 —— 别在这里换单位。
    int32 hp = 5;
    int32 max_hp = 6;             // ⚠️ 哈希读它（别省）
    int32 attack_ready_tick = 7;  // ⚠️ 哈希读它（别省）
}

/// 服务端 → 客户端：**开局**（把第 0 帧的世界交给客户端）。
///
/// ⚠️ 顺序契约：**`LockstepStart` 必须先于任何 `lockstep_frame`**（服务端保证）。
///    客户端在收到它之前处于"**未开局**"状态：此时收到 `lockstep_frame`
///    必须**忽略并计数**（不是"先跑起来再说"）—— 否则它会拿一个**空世界**去算，
///    结果是满屏假分歧，而真正的原因（开局没到）反而被淹没。
message LockstepStart
{
    /// 开局帧号。客户端把它设成世界的 `Tick` ⇒ 哈希清单里的第 9 项（`Tick`）也**被发**了。
    int32 frame = 1;

    /// ⚠️ 元素**可能以任意顺序到达** ⇒ 客户端建世界时**按 `entity_id` 排序**再 `Add`
    ///    （照 `WorldState.SnapshotSorted` 那套）。这条是 §29.2 判据② 在协议层的形态。
    repeated LockstepStartEntity entities = 2;

    /// ⭐ 服务端算出的**开局哈希**（同 `WorldStateHash` 的算法）。
    ///    客户端建完世界**先自己算一遍再比**：不等 ⇒ **不许开始**，报一条帧 0 的分歧（带两个哈希）。
    ///    这是"**能不能开始**"的判据 —— 它比后面逐帧对账更靠前。
    uint64 initial_hash = 3;
}

/// 服务端 → 客户端。
message ServerMessage
{
    oneof payload
    {
        HandshakeAck  handshake_ack = 1;
        Pong          pong          = 2;
        RoomState     room_state    = 3;
        WorldSnapshot snapshot      = 4;
        ServerEvent   event         = 5;
        ErrorResponse error         = 6;   // M3-S4 追加（兼容：只是多一个 oneof 分支）
        ProgressSync  progress_sync = 7;   // M4-S3 收口追加（兼容：同上）
        QuestStateSync quest_state  = 8;   // M4-S3 §二十六 追加（兼容：同上）
        LockstepFrame lockstep_frame = 9;  // M4-S4 S4-c 追加（兼容：同上）
        LockstepStart lockstep_start = 10; // M4-S4 S4-c 第二半 追加（兼容：同上）
    }
}

/// 客户端 → 服务端。
message ClientMessage
{
    oneof payload
    {
        Handshake       handshake  = 1;
        Ping            ping       = 2;
        JoinRoomRequest join_room  = 3;
        PlayerInput     input      = 4;
        LeaveRoomRequest leave_room = 5;   // M3-S4 追加（兼容）
        QuestActionRequest quest_action = 6;   // M4-S3 §二十六 追加（兼容）
        LockstepInput lockstep_input = 7;      // M4-S4 S4-c 追加（兼容）
    }
}
